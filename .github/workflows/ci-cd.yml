name: CloudIdentity CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Run Tests
        run: mvn clean test -B

      - name: Verify Compilation & Package
        run: mvn package -DskipTests -B

  docker-build-push:
    name: Build Docker Image & Verify
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container
        run: |
          docker build -t cloudidentity/cloud-identity-fingerprinting:${{ github.sha }} .
          docker tag cloudidentity/cloud-identity-fingerprinting:${{ github.sha }} cloudidentity/cloud-identity-fingerprinting:latest

  k8s-validate:
    name: Validate Kubernetes & Helm Manifests
    needs: docker-build-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: Lint Helm Chart
        run: helm lint helm/cloud-identity
