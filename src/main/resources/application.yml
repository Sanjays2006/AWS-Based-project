spring:
  application:
    name: cloud-identity-fingerprinting
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ===== DataSource =====
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cloud_identity_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 1800000
      pool-name: CloudIdentityHikariPool
      connection-test-query: SELECT 1

  # ===== JPA / Hibernate =====
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true
        default_schema: public
    show-sql: false
    open-in-view: false

  # ===== Flyway =====
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false

  # ===== Jackson =====
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: UTC

  # ===== Web MVC =====
  mvc:
    pathmatch:
      use-suffix-pattern: false

# ===== Server =====
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

# ===== JWT =====
jwt:
  secret: ${JWT_SECRET:7c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

# ===== AWS =====
aws:
  region: ${AWS_REGION:us-east-1}
  access-key-id: ${AWS_ACCESS_KEY_ID:}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
  account-id: ${AWS_ACCOUNT_ID:}
  sns:
    topic-arn: ${AWS_SNS_TOPIC_ARN:}
  cloudtrail:
    s3-bucket: ${AWS_CLOUDTRAIL_BUCKET:}
    s3-prefix: ${AWS_CLOUDTRAIL_PREFIX:AWSLogs/}

# ===== Application =====
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000}
  risk:
    critical-threshold: 76
    high-threshold: 51
    medium-threshold: 26
  anomaly:
    baseline-days: 30
    detection-enabled: true
  scheduler:
    cloudtrail-enabled: ${SCHEDULER_CLOUDTRAIL_ENABLED:false}
    s3-enabled: ${SCHEDULER_S3_ENABLED:false}
    s3-poll-ms: ${SCHEDULER_S3_POLL_MS:300000}
    s3-initial-delay-ms: ${SCHEDULER_S3_INITIAL_DELAY_MS:60000}
    fingerprint-enabled: ${SCHEDULER_FINGERPRINT_ENABLED:false}
    report-enabled: ${SCHEDULER_REPORT_ENABLED:false}
    baseline-enabled: ${SCHEDULER_BASELINE_ENABLED:false}

# ===== Actuator =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  application:
    name: Cloud Identity Behavior Fingerprinting System
    version: '@project.version@'
    description: AWS IAM identity monitoring and anomaly detection platform

# ===== Logging =====
logging:
  level:
    com.cloudidentity: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    software.amazon.awssdk: WARN
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%logger{36}] - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%logger{36}] - %msg%n"
  file:
    name: logs/cloud-identity.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
      total-size-cap: 500MB
