apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloud-identity-ingress
  namespace: cloud-identity
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  rules:
    - host: cloudidentity.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloud-identity-service
                port:
                  number: 80
