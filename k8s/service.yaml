apiVersion: v1
kind: Service
metadata:
  name: cloud-identity-service
  namespace: cloud-identity
  labels:
    app.kubernetes.io/name: cloud-identity-service
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: cloud-identity-app
