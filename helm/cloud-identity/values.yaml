replicaCount: 2

image:
  repository: cloudidentity/cloud-identity-fingerprinting
  pullPolicy: IfNotPresent
  tag: "1.0.0"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: cloudidentity.local
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 250m
    memory: 512Mi

env:
  springProfile: prod
  dbHost: postgres-service
  dbPort: 5432
  dbName: cloudidentity_db
  redisHost: redis-service
  redisPort: 6379
